name: Release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "생성할 릴리즈 태그"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  NDK_VERSION: "29.0.14206865"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop:
    name: ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: macos-x64
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Read application version
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'APP_VERSION=' + require('./src-tauri/tauri.conf.json').version + '\n')"
      - name: Build desktop installer
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect macOS installer
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          cp "$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' -type f | head -1)" "release-assets/Harness-Designer_${APP_VERSION}_${{ matrix.artifact }}.dmg"
      - name: Collect Linux installers
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          cp "$(find src-tauri/target/${{ matrix.target }}/release/bundle/deb -name '*.deb' -type f | head -1)" "release-assets/Harness-Designer_${APP_VERSION}_${{ matrix.artifact }}.deb"
          cp "$(find src-tauri/target/${{ matrix.target }}/release/bundle/appimage -name '*.AppImage' -type f | head -1)" "release-assets/Harness-Designer_${APP_VERSION}_${{ matrix.artifact }}.AppImage"
      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $installer = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated." }
          Copy-Item $installer.FullName "release-assets/Harness-Designer_${env:APP_VERSION}_${{ matrix.artifact }}_setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  android:
    name: Android
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Read application version
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'APP_VERSION=' + require('./src-tauri/tauri.conf.json').version + '\n')"
      - name: Build Android App Bundle
        run: npm run tauri android build -- --ci --aab --target aarch64 --target armv7 --target x86_64
      - name: Collect Android App Bundle
        run: |
          mkdir -p release-assets
          cp "$(find src-tauri/gen/android/app/build/outputs -name '*.aab' -type f | head -1)" "release-assets/Harness-Designer_${APP_VERSION}_android-unsigned.aab"
      - name: Build installable Android debug APK
        run: npm run tauri android build -- --ci --debug --apk --target aarch64 --target armv7 --target x86_64
      - name: Collect Android debug APK
        run: cp "$(find src-tauri/gen/android/app/build/outputs -name '*debug*.apk' -type f | head -1)" "release-assets/Harness-Designer_${APP_VERSION}_android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [desktop, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Resolve release tag
        run: echo "RELEASE_TAG=${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Harness Designer ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: true
          body: |
            Windows, macOS, Linux 및 Android용 자동 빌드입니다.

            - macOS와 Windows 설치 파일은 아직 상용 코드 서명 및 공증이 적용되지 않았습니다.
            - Android APK는 설치 시험용 디버그 서명 빌드입니다.
            - Android AAB는 Google Play 업로드 키가 설정되지 않은 미서명 산출물입니다.
          files: release-assets/*
